<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracking — Kantina</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page-tracking">
<div class="app-frame" id="screen-tracking">
  <div class="topnav">
    <div class="topnav-inner">
      <a class="topnav-brand" href="home.html">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none" width="15" height="15"><path d="M6 3v8a3 3 0 0 0 3 3v7M6 3v5M9 3v5M6 8h3M17 3c-2 1.2-2 4-2 6 0 1.6.8 2.6 2 3v9" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Kantina
      </a>
      <nav class="topnav-links"></nav>
      <div class="topnav-actions">
        <a class="icon-btn" href="cart.html" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" width="17" height="17"><path d="M6 6h15l-1.5 9h-12L6 6Zm0 0L5 3H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/></svg>
        </a>
      </div>
    </div>
  </div>
  <div class="appbar">
    <button class="icon-btn" type="button" aria-label="Go back" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1 id="tracking-ref"></h1>
  </div>

  <div class="scroll" style="position:relative;">
    <div class="flow-body">

      <!-- Status -->
      <div class="section-block">
        <p class="status-title" id="tracking-status"></p>
        <p class="status-sub" id="tracking-eta"></p>
        <div class="order-progress" id="tracking-progress" style="margin-top:16px;" aria-hidden="true"></div>
      </div>

      <!-- Timeline -->
      <div class="section-block">
        <h2 class="section-label">Timeline</h2>
        <div class="timeline" id="tracking-timeline"></div>
      </div>

      <!-- QR -->
      <div class="section-block">
        <h2 class="section-label">Pickup</h2>
        <div class="qr-row">
          <div class="qr-mini" aria-hidden="true">QR</div>
          <div>
            <div class="qr-title" id="tracking-counter"></div>
            <div class="qr-sub">Show this QR when collecting your order</div>
          </div>
        </div>
      </div>

    </div>

    <div class="sticky-footer">
      <button class="btn btn-primary" type="button" onclick="messageStall()">Message stall</button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
