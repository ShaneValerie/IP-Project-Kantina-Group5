<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracking — Kantina</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap">
</head>
<body class="page-tracking flow-page">
<div class="app-frame" id="screen-tracking">
  <div class="topnav">
    <div class="topnav-inner">
      <a class="topnav-brand" href="home.html">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none" width="15" height="15"><path d="M6 3v8a3 3 0 0 0 3 3v7M6 3v5M9 3v5M6 8h3M17 3c-2 1.2-2 4-2 6 0 1.6.8 2.6 2 3v9" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Kantina
      </a>
      <nav class="topnav-links"></nav>
      <div class="topnav-actions">
        <a class="icon-btn" href="cart.html" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" width="17" height="17"><path d="M6 6h15l-1.5 9h-12L6 6Zm0 0L5 3H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/></svg>
        </a>
      </div>
    </div>
  </div>
  <header class="flow-head">
  <div class="flow-head-top">
    <button class="icon-btn" type="button" aria-label="Go back" onclick="goBack('orders.html')">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="flow-head-meta" id="tracking-ref"></span>
  </div>
  <div class="flow-head-text">
    <h1 id="tracking-status"></h1>
    <p id="tracking-eta"></p>
  </div>
  <ol class="flow-steps" id="tracking-steps" aria-label="Order progress"></ol>
  </header>

  <div class="scroll" style="position:relative;">
    <div class="flow-body">

      <!-- Timeline -->
      <div class="section-block">
        <h2 class="section-label">Timeline</h2>
        <div class="timeline" id="tracking-timeline"></div>
      </div>

      <!-- QR -->
      <div class="section-block">
        <h2 class="section-label">Pickup</h2>
        <div class="qr-row">
          <div class="qr-mini"><svg class="qr-svg" viewBox="0 0 21 21" role="img" aria-label="Sample pickup QR code" shape-rendering="crispEdges"><rect width="21" height="21" fill="#fff"/><g fill="#132A1E"><path d="M0 0h7v7H0zM14 0h7v7h-7zM0 14h7v7H0z"/><path fill="#fff" d="M1 1h5v5H1zM15 1h5v5h-5zM1 15h5v5H1z"/><path d="M2 2h3v3H2zM16 2h3v3h-3zM2 16h3v3H2zM9 1h1v2H9zM11 3h2v1h-2zM8 5h1v3H8zM10 8h3v1h-3zM14 9h2v2h-2zM17 8h3v1h-3zM9 10h1v3H9zM12 11h1v2h-1zM1 9h3v1H1zM5 10h2v2H5zM15 13h1v3h-1zM18 12h2v2h-2zM10 15h3v1h-3zM9 17h2v3H9zM13 18h3v1h-3zM17 16h1v4h-1zM19 19h1v1h-1z"/></g></svg></div>
          <div>
            <div class="qr-title" id="tracking-counter"></div>
            <div class="qr-sub">Show this QR when collecting your order</div>
          </div>
        </div>
      </div>

    </div>

    <div class="sticky-footer">
      <button class="btn btn-primary" type="button" onclick="messageStall()">Message stall</button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
