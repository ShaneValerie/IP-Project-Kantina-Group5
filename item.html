<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tapsilog — Kantina</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap">
</head>
<body class="page-item flow-page">
<div class="app-frame" id="screen-item">
  <div class="topnav">
    <div class="topnav-inner">
      <a class="topnav-brand" href="home.html">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none" width="15" height="15"><path d="M6 3v8a3 3 0 0 0 3 3v7M6 3v5M9 3v5M6 8h3M17 3c-2 1.2-2 4-2 6 0 1.6.8 2.6 2 3v9" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Kantina
      </a>
      <nav class="topnav-links">
        <a href="home.html" class="active">Home</a>
        <a href="reservations.html">Reserve</a>
        <a href="orders.html">Orders</a>
        <a href="profile.html">Profile</a>
      </nav>
      <div class="topnav-actions">
        <a class="icon-btn" href="cart.html" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" width="17" height="17"><path d="M6 6h15l-1.5 9h-12L6 6Zm0 0L5 3H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/></svg>
        </a>
      </div>
    </div>
  </div>
  <header class="flow-head">
  <div class="flow-head-top">
    <a class="icon-btn" href="stall.html" aria-label="Back to Lola&rsquo;s Silog"><svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  </div>
  <div class="flow-head-text">
    <span class="flow-head-meta">Lola&rsquo;s Silog</span>
    <h1>Tapsilog</h1>
    <p>Make it your way</p>
  </div>
  </header>

  <div class="scroll">
    <div class="item-layout">
      <div class="item-photo">
        <img class="photo-img" src="assets/img/food/tapsilog.jpg" alt="Tapsilog with garlic fried rice">
      </div>
      <div class="item-body">
        <div class="item-title-row">
          <h2>Tapsilog</h2>
          <p class="item-price">₱85</p>
        </div>
        <p class="item-desc">Marinated beef tapa, garlic fried rice, and a sunny-side-up egg. Served with atchara on the side.</p>

        <h3 class="section-label">Add-ons</h3>
        <label class="addon-row">
          <input type="checkbox" data-price="15">
          <div class="addon-text"><strong>Extra rice</strong><span>+₱15</span></div>
        </label>
        <label class="addon-row">
          <input type="checkbox" data-price="12">
          <div class="addon-text"><strong>Fried egg</strong><span>+₱12</span></div>
        </label>

        <div class="note-field">
          <label for="note" class="section-label">Note to kitchen</label>
          <textarea id="note" placeholder="e.g. no onions, sauce on the side"></textarea>
        </div>

        <div class="item-footer">
          <div class="stepper">
            <button type="button" id="qty-minus" aria-label="One less">−</button>
            <span id="qty" aria-live="polite">1</span>
            <button type="button" id="qty-plus" aria-label="One more">+</button>
          </div>
          <a class="btn btn-primary" style="flex:1;" href="stall.html" id="add-btn">Add · ₱85</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
// Add-ons and quantity update the price on the Add button.
(function () {
  const BASE_PRICE = 85;
  let qty = 1;
  const addBtn = document.getElementById('add-btn');
  const qtyEl = document.getElementById('qty');
  function update() {
    const extras = Array.from(document.querySelectorAll('.addon-row input:checked'))
      .reduce((sum, el) => sum + Number(el.dataset.price), 0);
    qtyEl.textContent = qty;
    addBtn.textContent = 'Add \u00b7 \u20B1' + (BASE_PRICE + extras) * qty;
  }
  document.querySelectorAll('.addon-row input').forEach(el => el.addEventListener('change', update));
  document.getElementById('qty-minus').addEventListener('click', () => { if (qty > 1) { qty--; update(); } });
  document.getElementById('qty-plus').addEventListener('click', () => { if (qty < 10) { qty++; update(); } });
})();
</script>
</body>
</html>
