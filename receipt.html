<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order placed — Kantina</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page-receipt">
<div class="app-frame" id="screen-receipt">
  <div class="topnav">
    <div class="topnav-inner">
      <a class="topnav-brand" href="home.html">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none" width="15" height="15"><path d="M6 3v8a3 3 0 0 0 3 3v7M6 3v5M9 3v5M6 8h3M17 3c-2 1.2-2 4-2 6 0 1.6.8 2.6 2 3v9" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Kantina
      </a>
      <nav class="topnav-links"></nav>
      <div class="topnav-actions">
        <a class="icon-btn" href="cart.html" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" width="17" height="17"><path d="M6 6h15l-1.5 9h-12L6 6Zm0 0L5 3H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/></svg>
        </a>
      </div>
    </div>
  </div>
  <div class="appbar centered">
    <h1>Order placed</h1>
  </div>

  <div class="scroll" style="position:relative;">
    <div class="flow-body stacked-footer">

      <!-- Success hero -->
      <div class="section-block">
        <div class="success-hero">
          <div class="success-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <p class="success-title">You're all set!</p>
          <p class="success-sub" id="receipt-ref"></p>
          <div class="qr-box" aria-label="Pickup QR code">QR code</div>
          <p class="qr-box-note">Show this at the counter</p>
        </div>
      </div>

      <!-- Order summary -->
      <div class="section-block">
        <h2 class="section-label">Order summary</h2>
        <div class="summary-box" id="receipt-summary" style="border-top:none; margin-top:0; padding-top:0;"></div>
      </div>

    </div>

    <div class="sticky-footer footer-stack">
      <button class="btn btn-primary" type="button" onclick="trackOrder()">Track order</button>
      <button class="btn btn-secondary" type="button" onclick="backToHome()">Back to home</button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
