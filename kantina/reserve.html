<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reserve a table — Kantina</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap">
</head>
<body class="page-reserve flow-page">
<div class="app-frame" id="screen-reserve">
  <div class="topnav">
    <div class="topnav-inner">
      <a class="topnav-brand" href="home.html">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none" width="15" height="15"><path d="M6 3v8a3 3 0 0 0 3 3v7M6 3v5M9 3v5M6 8h3M17 3c-2 1.2-2 4-2 6 0 1.6.8 2.6 2 3v9" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Kantina
      </a>
      <nav class="topnav-links">
        <a href="home.html">Home</a>
        <a href="reserve.html" class="active">Reserve</a>
        <a href="orders.html">Orders</a>
        <a href="profile.html">Profile</a>
      </nav>
      <div class="topnav-actions">
        <a class="icon-btn" href="cart.html" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" width="17" height="17"><path d="M6 6h15l-1.5 9h-12L6 6Zm0 0L5 3H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/></svg>
        </a>
      </div>
    </div>
  </div>

  <header class="flow-head">
  <div class="flow-head-top">
    <a class="icon-btn" href="home.html" id="reserve-back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  </div>
  <div class="flow-head-text">
    <h1 id="reserve-title">Save a seat</h1>
    <p>Pick a day, time and table</p>
  </div>
  </header>

  <div class="scroll" style="position:relative;">
    <div class="rsv-body">

      <div class="section-label">Day</div>
      <div class="rsv-chip-row" id="day-group" role="group" aria-label="Day"></div>

      <div class="rsv-reserve-cols">
        <div>
          <div class="section-label">Party size</div>
          <div class="rsv-party" id="party-group" role="group" aria-label="Party size">
            <button type="button" data-party="1" aria-pressed="false">1</button>
            <button type="button" data-party="2" aria-pressed="true">2</button>
            <button type="button" data-party="4" aria-pressed="false">4</button>
            <button type="button" data-party="6" aria-pressed="false">6</button>
          </div>

          <div class="section-label">Time slot</div>
          <div class="rsv-slots" id="slot-group" role="group" aria-label="Time slot"></div>
        </div>

        <div>
          <div class="section-label">Pick a table · Lawrence Bunzel Canteen</div>
          <div class="rsv-floor">
            <div class="rsv-floor-grid" id="table-group" role="group" aria-label="Floor plan"><p class="load-msg">Loading tables…</p></div>
            <div class="rsv-legend">
              <span><i></i>Free</span>
              <span><i class="picked"></i>Your pick</span>
              <span><i class="taken"></i>Taken</span>
            </div>
          </div>

          <div class="rsv-note">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v5M12 16h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <div>Tables are held for 10 minutes past the start time, then released automatically.</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div class="rsv-footer">
    <button class="btn btn-primary" type="button" id="hold-btn" disabled>Pick a table</button>
  </div>

  <div class="tabbar">
    <a class="tab" href="home.html">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Home</span>
    </a>
    <a class="tab active" href="reserve.html">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9.5h17M8 3v3.5M16 3v3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Reserve</span>
    </a>
    <a class="tab" href="orders.html">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 3h12l1 4H5l1-4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M5 7v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V7M9 11h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Orders</span>
    </a>
    <a class="tab" href="profile.html">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.3" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Profile</span>
    </a>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="js/api.js"></script>
<script src="app.js"></script>
<script>
// Reserve: GET /tables/availability for the chosen day, time and party size; Hold → POST /reservations.
// Opened from checkout (?from=checkout), the new reservation is saved on the tray and we go back there.
(function () {
  const user = Auth.requireStudent();
  const fromCheckout = qs('from') === 'checkout';
  document.getElementById('reserve-title').textContent = 'Save a seat, ' + user.first_name;
  const back = document.getElementById('reserve-back');
  back.href = fromCheckout ? 'checkout.html' : 'reservations.html';

  const dayEl = document.getElementById('day-group');
  const slotEl = document.getElementById('slot-group');
  const tableEl = document.getElementById('table-group');
  const holdBtn = document.getElementById('hold-btn');
  const state = { date: null, time: null, party: 2, table: null };
  let request = 0;
  let holding = false;   // a POST /reservations is running: keep Hold locked

  function updateHold() {
    if (holding) return;
    holdBtn.disabled = !state.table;
    holdBtn.textContent = state.table ? 'Hold ' + state.table + ' · ' + Fmt.ampm(state.time) : 'Pick a table';
  }

  function tableLabel(t) {
    if (t.status === 'taken') return 'taken';
    if (t.status === 'blocked') return 'not available';
    if (!t.fits) return t.seats + ' seats · too small';
    return t.seats + ' seats';
  }

  function render(res) {
    state.date = res.date;
    state.time = res.time;
    dayEl.innerHTML = res.days.map(d =>
      `<button class="rsv-chip" type="button" data-date="${escapeHtml(d.date)}" aria-pressed="${d.date === res.date}">${escapeHtml(d.label)}</button>`).join('');
    const past = {};
    (res.slot_states || []).forEach(s => { past[s.time] = s.past; });
    slotEl.innerHTML = res.slots.map(t => past[t]
      ? `<button class="rsv-slot" type="button" disabled aria-disabled="true">${Fmt.time12(t)}</button>`
      : `<button class="rsv-slot" type="button" data-time="${escapeHtml(t)}" aria-pressed="${t === res.time}">${Fmt.time12(t)}</button>`).join('');
    // keep the picked table only if it is still free and big enough
    const free = res.tables.filter(t => t.status === 'free' && t.fits).map(t => t.code);
    if (!free.includes(state.table)) state.table = null;
    tableEl.innerHTML = res.tables.map(t => {
      const pos = `grid-row:${Number(t.row)};grid-column:${Number(t.col)};`;
      const usable = t.status === 'free' && t.fits;
      return usable
        ? `<button class="rsv-table" type="button" style="${pos}" data-table="${escapeHtml(t.code)}" aria-pressed="${t.code === state.table}">${escapeHtml(t.code)}<small>${tableLabel(t)}</small></button>`
        : `<button class="rsv-table" type="button" style="${pos}" disabled aria-disabled="true">${escapeHtml(t.code)}<small>${tableLabel(t)}</small></button>`;
    }).join('');
    updateHold();
  }

  function load() {
    const id = ++request;
    return Api.get('/tables/availability', { date: state.date, time: state.time, party: state.party })
      .then(res => {
        if (id !== request) return;          // a newer choice is already loading
        // the chosen time has passed (e.g. late in the day): jump to the next free time or day
        const states = res.slot_states || [];
        const current = states.find(s => s.time === res.time);
        if (current && current.past) {
          const next = states.find(s => !s.past);
          const nextDay = res.days[res.days.findIndex(d => d.date === res.date) + 1];
          if (next) { state.date = res.date; state.time = next.time; return load(); }
          if (nextDay) { state.date = nextDay.date; state.time = null; return load(); }
        }
        render(res);
      })
      .catch(err => {
        if (id !== request) return;
        // a day or time from an older visit may no longer be allowed: start again from the defaults
        if (err.status === 422 && (state.date || state.time)) { state.date = state.time = null; return load(); }
        tableEl.innerHTML = `<p class="load-msg">${escapeHtml(err.message)}</p>`;
      });
  }

  dayEl.addEventListener('click', (e) => {
    const chip = e.target.closest('.rsv-chip');
    if (!chip) return;
    state.date = chip.dataset.date;
    state.time = null;
    load();
  });
  slotEl.addEventListener('click', (e) => {
    const slot = e.target.closest('.rsv-slot');
    if (!slot || slot.disabled) return;
    state.time = slot.dataset.time;
    load();
  });
  document.getElementById('party-group').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-party]');
    if (!btn) return;
    document.querySelectorAll('#party-group button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    state.party = Number(btn.dataset.party);
    load();
  });
  tableEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.rsv-table');
    if (!btn || btn.disabled) return;
    state.table = btn.dataset.table;
    tableEl.querySelectorAll('.rsv-table[data-table]').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    updateHold();
  });

  holdBtn.addEventListener('click', () => {
    if (!state.table || holding) return;
    holding = true;
    holdBtn.disabled = true;
    holdBtn.textContent = 'Holding…';
    Api.post('/reservations', { table: state.table, date: state.date, time: state.time, party_size: state.party })
      .then(res => {
        const ref = res.reservation.ref;
        if (fromCheckout) {
          Cart.setPrefs({ reservation_ref: ref });
          location.href = 'checkout.html';
        } else {
          location.href = 'reservation-confirmed.html?ref=' + encodeURIComponent(ref);
        }
      })
      .catch(err => {
        holding = false;
        showToast(err.message);
        updateHold();
        load();                              // someone may have just taken the table
      });
  });

  load();
})();
</script>
</body>
</html>
