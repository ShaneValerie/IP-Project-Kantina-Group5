<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kantina API docs</title>
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
<style>
  body { margin: 0; background: #fafafa; }
  .kantina-bar { background: #015E2F; color: #fff; padding: 14px 24px; font: 600 16px -apple-system, "Segoe UI", Roboto, sans-serif; }
  .kantina-bar span { font-weight: 400; opacity: .85; font-size: 13px; margin-left: 10px; }
  .swagger-ui .topbar { display: none; }
</style>
</head>
<body>
<div class="kantina-bar">Kantina API <span>Click “Authorize” and paste a token from POST /auth/login to try protected endpoints.</span></div>
<div id="swagger"></div>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
  window.ui = SwaggerUIBundle({
    url: 'openapi.yaml',
    dom_id: '#swagger',
    deepLinking: true,
    persistAuthorization: true,
    docExpansion: 'none',
    tryItOutEnabled: true
  });
</script>
</body>
</html>
