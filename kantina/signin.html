<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — Kantina</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap">
</head>
<body class="page-signin">
<div class="app-frame" id="screen-signin">
  <div class="scroll">
    <div class="signin-top">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 3v8a3 3 0 0 0 3 3v7M6 3v5M9 3v5M6 8h3M17 3c-2 1.2-2 4-2 6 0 1.6.8 2.6 2 3v9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2>Kantina</h2>
      <p>University of San Carlos, ordered ahead.</p>
    </div>

    <form id="signin-form" novalidate>
      <div class="field">
        <label for="uid">Student ID / email</label>
        <input id="uid" name="login" type="text" placeholder="e.g. 21-0942" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="pwd">Password</label>
        <input id="pwd" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <p class="signin-error" id="signin-error" role="alert" hidden></p>

      <div class="signin-actions">
        <button class="btn btn-primary" type="submit" id="signin-btn">Sign in</button>
        <button class="btn btn-secondary" type="button" onclick="document.getElementById('signup-note').hidden = false">Create account</button>
      </div>
    </form>

    <p class="signin-switch" id="signup-note" role="status" hidden>Sign-up isn&rsquo;t open yet. Sign in with your student ID for now.</p>
    <p class="signin-switch signin-demo">Demo account: <strong>21-0942</strong> · password <strong>kantina123</strong></p>

    <div class="signin-switch">
      Store staff? <a class="link-btn" href="seller/login.html">Switch to store login</a>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script>
// Sign in: POST /auth/login → save the token → go to the page the student wanted (or home).
// This is the reference example for wiring a page to the API.
(function () {
  if (Auth.token() && Auth.user() && Auth.user().role === 'student') {
    location.replace(Auth.nextUrl('home.html'));
    return;
  }
  var form = document.getElementById('signin-form');
  var errorEl = document.getElementById('signin-error');
  var button = document.getElementById('signin-btn');

  function showError(message) {
    errorEl.textContent = message;
    errorEl.hidden = !message;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var login = document.getElementById('uid').value.trim();
    var password = document.getElementById('pwd').value;
    if (!login || !password) {
      showError('Enter your student ID (or email) and password.');
      return;
    }
    showError('');
    button.disabled = true;
    button.textContent = 'Signing in…';
    Api.post('/auth/login', { login: login, password: password })
      .then(function (res) {
        Auth.save(res.token, res.user);
        location.replace(Auth.nextUrl('home.html'));
      })
      .catch(function (err) {
        showError(err.message);
        button.disabled = false;
        button.textContent = 'Sign in';
      });
  });
})();
</script>
</body>
</html>
