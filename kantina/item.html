<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu item — Kantina</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap">
</head>
<body class="page-item flow-page">
<div class="app-frame" id="screen-item">
  <div class="topnav">
    <div class="topnav-inner">
      <a class="topnav-brand" href="home.html">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none" width="15" height="15"><path d="M6 3v8a3 3 0 0 0 3 3v7M6 3v5M9 3v5M6 8h3M17 3c-2 1.2-2 4-2 6 0 1.6.8 2.6 2 3v9" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Kantina
      </a>
      <nav class="topnav-links">
        <a href="home.html" class="active">Home</a>
        <a href="reservations.html">Reserve</a>
        <a href="orders.html">Orders</a>
        <a href="profile.html">Profile</a>
      </nav>
      <div class="topnav-actions">
        <a class="icon-btn" href="cart.html" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" width="17" height="17"><path d="M6 6h15l-1.5 9h-12L6 6Zm0 0L5 3H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/></svg>
        </a>
      </div>
    </div>
  </div>
  <header class="flow-head">
  <div class="flow-head-top">
    <a class="icon-btn" href="home.html" id="back-link" aria-label="Back to the stall"><svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  </div>
  <div class="flow-head-text">
    <span class="flow-head-meta" id="item-stall"></span>
    <h1 id="item-name">Loading…</h1>
    <p>Make it your way</p>
  </div>
  </header>

  <div class="scroll">
    <div class="item-layout" id="item-layout">
      <div class="item-photo" id="item-photo"></div>
      <div class="item-body">
        <div class="item-title-row">
          <h2 id="item-title"></h2>
          <p class="item-price" id="item-price"></p>
        </div>
        <p class="item-stock" id="item-stock" hidden></p>
        <p class="item-desc" id="item-desc"></p>

        <div id="addon-section" hidden>
          <h3 class="section-label">Add-ons</h3>
          <div id="addon-list"></div>
        </div>

        <div class="note-field">
          <label for="note" class="section-label">Note to kitchen</label>
          <textarea id="note" maxlength="200" placeholder="e.g. no onions, sauce on the side"></textarea>
        </div>

        <div class="item-footer">
          <div class="stepper">
            <button type="button" id="qty-minus" aria-label="One less">−</button>
            <span id="qty" aria-live="polite">1</span>
            <button type="button" id="qty-plus" aria-label="One more">+</button>
          </div>
          <button class="btn btn-primary" style="flex:1;" type="button" id="add-btn" disabled>Add</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="js/api.js"></script>
<script src="app.js"></script>
<script>
// Item detail: GET /menu-items/{sku}. Add-ons and quantity update the price on
// the Add button; Add puts the item in the tray (Cart) and goes back to the stall.
(function () {
  Auth.requireStudent();

  const PLACEHOLDER = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 3v8a2.5 2.5 0 0 0 2.5 2.5V21M4 3v5M6.5 3v5M4 6.5h2.5M15 3c-1.6 1-1.6 3.5-1.6 5.2 0 1.4.7 2.3 1.6 2.6V21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  let item = null;
  let BASE_PRICE = 0;
  let qty = 1;
  let maxQty = 10;
  let canOrder = false;
  const addBtn = document.getElementById('add-btn');
  const qtyEl = document.getElementById('qty');

  function checkedAddons() {
    return Array.from(document.querySelectorAll('#addon-list input:checked'))
      .map(el => ({ sku: el.dataset.sku, name: el.dataset.name, price: Number(el.dataset.price) }));
  }

  function update() {
    qtyEl.textContent = qty;
    if (!canOrder) return;
    const extras = checkedAddons().reduce((sum, a) => sum + a.price, 0);
    addBtn.textContent = 'Add \u00b7 ' + Fmt.peso((BASE_PRICE + extras) * qty);
  }

  document.getElementById('addon-list').addEventListener('change', update);
  document.getElementById('qty-minus').addEventListener('click', () => { if (qty > 1) { qty--; update(); } });
  document.getElementById('qty-plus').addEventListener('click', () => { if (qty < maxQty) { qty++; update(); } });

  addBtn.addEventListener('click', () => {
    if (!canOrder) return;
    Cart.add({
      sku: item.sku, name: item.name, price: item.price, qty: qty,
      addons: checkedAddons(), note: document.getElementById('note').value.trim(),
      stall: { id: item.stall.id, name: item.stall.name }, photo_url: item.photo_url
    });
    addBtn.disabled = true;
    showToast('Added to tray');
    setTimeout(() => { location.href = 'stall.html?id=' + encodeURIComponent(item.stall.id); }, 900);
  });

  function showError(message) {
    document.getElementById('item-name').textContent = 'Item not found';
    document.getElementById('item-layout').innerHTML = `<p class="load-msg">${escapeHtml(message)} <a href="home.html">Back to stalls</a></p>`;
  }

  const sku = qs('sku');
  if (!sku) { location.replace('home.html'); return; }   // older links (cart "Edit") don't name an item yet

  Api.get('/menu-items/' + encodeURIComponent(sku))
    .then(res => {
      item = res.item;
      BASE_PRICE = Number(item.price);
      document.title = item.name + ' \u2014 Kantina';
      document.getElementById('item-stall').textContent = item.stall.name;
      document.getElementById('item-name').textContent = item.name;
      document.getElementById('item-title').textContent = item.name;
      document.getElementById('item-price').textContent = Fmt.peso(item.price);
      document.getElementById('item-desc').textContent = item.description || '';
      const back = document.getElementById('back-link');
      back.href = 'stall.html?id=' + encodeURIComponent(item.stall.id);
      back.setAttribute('aria-label', 'Back to ' + item.stall.name);
      document.getElementById('item-photo').innerHTML = item.photo_url
        ? `<img class="photo-img" src="${escapeHtml(item.photo_url)}" alt="${escapeHtml(item.name)}">`
        : PLACEHOLDER;

      if (res.addons.length) {
        document.getElementById('addon-section').hidden = false;
        document.getElementById('addon-list').innerHTML = res.addons.map(a => `
          <label class="addon-row${a.available ? '' : ' unavailable'}">
            <input type="checkbox" data-sku="${escapeHtml(a.sku)}" data-name="${escapeHtml(a.name)}" data-price="${Number(a.price)}"${a.available ? '' : ' disabled'}>
            <div class="addon-text"><strong>${escapeHtml(a.name)}</strong><span>${a.available ? '+' + Fmt.peso(a.price) : 'Not available'}</span></div>
          </label>`).join('');
      }

      // Never let the tray hold more than the stall has left (stock is null when it isn't tracked).
      const inTray = Cart.items().filter(i => i.sku === item.sku).reduce((n, i) => n + i.qty, 0);
      if (item.stock !== null && item.stock !== undefined) maxQty = Math.min(10, item.stock - inTray);
      if (item.stock !== null && item.stock !== undefined && item.stock > 0 && (item.low_stock || item.stock <= 5)) {
        const stockEl = document.getElementById('item-stock');
        stockEl.textContent = 'Only ' + item.stock + ' left today';
        stockEl.hidden = false;
      }

      canOrder = item.available && !item.sold_out && item.stall.accepts_orders && maxQty >= 1;
      addBtn.disabled = !canOrder;
      if (!canOrder) {
        addBtn.textContent = item.sold_out ? 'Sold out today'
          : !item.stall.accepts_orders ? 'Stall isn\u2019t taking orders'
          : !item.available ? 'Not available today'
          : 'All ' + item.stock + ' left are in your tray';
      }
      update();
    })
    .catch(err => showError(err.message));
})();
</script>
</body>
</html>
