<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home — Kantina</title>
<link rel="stylesheet" href="style.css">

</head>
<body class="page-home flow-page">
<div class="app-frame" id="screen-home">
  <div class="topnav">
    <div class="topnav-inner">
      <a class="topnav-brand" href="home.html">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none" width="15" height="15"><path d="M6 3v8a3 3 0 0 0 3 3v7M6 3v5M9 3v5M6 8h3M17 3c-2 1.2-2 4-2 6 0 1.6.8 2.6 2 3v9" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Kantina
      </a>
      <nav class="topnav-links">
        <a href="home.html" class="active">Home</a>
        <a href="reservations.html">Reserve</a>
        <a href="orders.html">Orders</a>
        <a href="profile.html">Profile</a>
      </nav>
      <div class="topnav-actions">
        <a class="icon-btn" href="cart.html" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" width="17" height="17"><path d="M6 6h15l-1.5 9h-12L6 6Zm0 0L5 3H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/></svg>
        </a>
      </div>
    </div>
  </div>
  <div class="home-header">
    <div class="brand-row">
      <span class="wordmark">Kantina</span>
      <a class="icon-btn" href="cart.html" aria-label="Cart"><svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M6 6h15l-1.5 9h-12L6 6Zm0 0L5 3H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/></svg></a>
    </div>
    <h2 id="greeting">What&rsquo;s for lunch?</h2>
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Search food or stall</span>
    </div>
  </div>

  <div class="scroll">
    <div class="home-body">
      <div id="announcement"></div>

      <a class="reserve-banner" href="reserve.html">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 9.5h17M8 3v3.5M16 3v3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </div>
        <div class="text">
          <strong>Reserve a table</strong>
          <span>Skip the line for group orders</span>
        </div>
        <span class="btn-mini">Reserve</span>
      </a>

      <div class="chip-row" id="category-chips" role="group" aria-label="Filter stalls by category"></div>

      <div class="section-label" id="open-count">Loading stalls…</div>

      <div class="stall-list" id="stall-list"></div>
    </div>
  </div>

  <div class="tabbar">
    <a class="tab active" href="home.html">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Home</span>
    </a>
    <a class="tab" href="reservations.html">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9.5h17M8 3v3.5M16 3v3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Reserve</span>
    </a>
    <a class="tab" href="orders.html">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 3h12l1 4H5l1-4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M5 7v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V7M9 11h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Orders</span>
    </a>
    <a class="tab" href="profile.html">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.3" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Profile</span>
    </a>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="js/api.js"></script>
<script src="app.js"></script>
<script>
// Home: stalls, category chips and the announcement come from the API
// (GET /stalls, GET /announcements). Chips filter the list without another request.
(function () {
  const user = Auth.requireStudent();

  // Greeting changes with the time of day (canteen serves 7 AM to 6 PM).
  const name = user.first_name;
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  let text;
  if (mins >= 5 * 60 && mins < 10 * 60 + 30)  text = 'What\u2019s for breakfast, ' + name + '?';
  else if (mins < 14 * 60 && mins >= 10 * 60 + 30) text = 'What\u2019s for lunch, ' + name + '?';
  else if (mins >= 14 * 60 && mins < 18 * 60) text = 'Merienda time, ' + name + '?';
  else text = 'Plan tomorrow\u2019s meal, ' + name + '?';
  document.getElementById('greeting').textContent = text;

  const PLACEHOLDER = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 3v8a2.5 2.5 0 0 0 2.5 2.5V21M4 3v5M6.5 3v5M4 6.5h2.5M15 3c-1.6 1-1.6 3.5-1.6 5.2 0 1.4.7 2.3 1.6 2.6V21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const listEl = document.getElementById('stall-list');
  const chipsEl = document.getElementById('category-chips');
  const countEl = document.getElementById('open-count');
  let stalls = [];
  let category = '';

  function stallCard(s) {
    const photo = s.photo_url
      ? `<img class="photo-img" src="${escapeHtml(s.photo_url)}" alt="${escapeHtml(s.name)}" loading="lazy">`
      : PLACEHOLDER;
    const inner = `
          <div class="stall-thumb">${photo}</div>
          <div class="stall-info">
            <div class="text"><strong>${escapeHtml(s.name)}</strong><span class="meta">${escapeHtml(s.category)} · ~${Number(s.prep_minutes)} min</span></div>
            <span class="open-badge${s.is_open ? '' : ' closed'}">${escapeHtml(s.status_text)}</span>
          </div>`;
    // Students can pre-order outside opening hours; only temporarily closed stalls are greyed out.
    return s.accepts_orders
      ? `<a class="stall-card" href="stall.html?id=${encodeURIComponent(s.id)}">${inner}</a>`
      : `<div class="stall-card disabled" aria-disabled="true">${inner}</div>`;
  }

  function renderList() {
    const shown = category ? stalls.filter(s => s.category === category) : stalls;
    listEl.innerHTML = shown.length
      ? shown.map(stallCard).join('')
      : '<p class="load-msg">No stalls in this category yet.</p>';
  }

  function renderChips(categories) {
    chipsEl.innerHTML = [''].concat(categories).map(c =>
      `<button type="button" class="chip${c === category ? ' active' : ''}" data-category="${escapeHtml(c)}" aria-pressed="${c === category}">${c ? escapeHtml(c) : 'All'}</button>`
    ).join('');
  }

  chipsEl.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    category = chip.dataset.category;
    chipsEl.querySelectorAll('.chip').forEach(c => {
      const on = c === chip;
      c.classList.toggle('active', on);
      c.setAttribute('aria-pressed', on);
    });
    renderList();
  });

  Api.get('/stalls')
    .then(res => {
      stalls = res.stalls;
      const n = res.open_count;
      countEl.textContent = n
        ? n + (n === 1 ? ' stall' : ' stalls') + ' open now'
        : 'No stalls open right now · pre-order for later';
      renderChips(res.categories);
      renderList();
    })
    .catch(err => {
      countEl.textContent = '';
      listEl.innerHTML = `<p class="load-msg">${escapeHtml(err.message)}</p>`;
    });

  // Optional: the newest announcement, styled like the reserve banner.
  Api.get('/announcements')
    .then(res => {
      const a = res.announcements[0];
      if (!a) return;
      const link = a.link_url && /^[\w\-./?=&#]+$/.test(a.link_url) && !a.link_url.startsWith('//') && a.link_url !== 'home.html' ? a.link_url : '';
      const body = `
        <div class="icon-wrap"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 11v5M12 8h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>
        <div class="text"><strong>${escapeHtml(a.title)}</strong><span>${escapeHtml(a.body)}</span></div>`;
      document.getElementById('announcement').innerHTML = link
        ? `<a class="reserve-banner announce" href="${escapeHtml(link)}">${body}</a>`
        : `<div class="reserve-banner announce">${body}</div>`;
    })
    .catch(() => { /* announcements are optional */ });
})();
</script>
</body>
</html>
