<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kantina · Menu</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page-seller-app page-seller-menu">

<div class="app-shell">

  <header class="app-topbar">
    <h1 id="page-title">Menu</h1>
    <button class="btn-add" id="add-item-btn">+ Add item</button>
  </header>

  <div class="app-body">

    <aside class="sidebar">
      <nav>
        <ul id="nav-list">
          <li><a class="nav-item" href="orders.html">Orders</a></li>
          <li><a class="nav-item is-active" href="menu.html">Menu</a></li>
          <li><a class="nav-item" href="analytics.html">Analytics</a></li>
          <li><a class="nav-item" href="tables.html">Tables</a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <button class="nav-item" data-panel="settings">Settings</button>
        <a class="nav-item" href="login.html" id="sign-out">Sign out</a>
      </div>
    </aside>

    <main class="content" id="content">
      <div class="table-header">
        <span>Item</span>
        <span>Price</span>
        <span>Stock</span>
        <span>Available</span>
        <span></span>
      </div>

      <div class="item-list" id="item-list" aria-live="polite">
        <p class="list-footnote">Loading menu…</p>
      </div>

      <p class="list-footnote">Toggling off hides the item from students immediately.</p>
      <p class="list-footnote">Prices and stock are saved to Kantina ERP; names and descriptions to Kantina CMS.</p>
    </main>

    <div class="panel-placeholder" id="panel-placeholder" hidden></div>

  </div>

</div>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">Add item</h2>
    <form id="add-item-form">
      <div class="field">
        <label for="field-name">Item name</label>
        <input type="text" id="field-name" name="name" required minlength="2" maxlength="80" autocomplete="off">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="field-price">Price (₱)</label>
          <input type="number" id="field-price" name="price" min="0" max="10000" step="1" required>
        </div>
        <div class="field" id="stock-field">
          <label for="field-stock">Stock</label>
          <input type="number" id="field-stock" name="stock" min="0" max="10000" step="1" required>
        </div>
      </div>
      <div class="field">
        <label for="field-section">Section <span class="optional">(optional)</span></label>
        <input type="text" id="field-section" name="section" maxlength="60" placeholder="e.g. Silog" autocomplete="off">
      </div>
      <div class="field">
        <label for="field-description">Description <span class="optional">(optional)</span></label>
        <textarea id="field-description" name="description" rows="2" maxlength="2000"></textarea>
      </div>
      <div class="field field-checkbox">
        <input type="checkbox" id="field-available" name="available" checked>
        <label for="field-available">Available to order</label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-outline" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn-solid" id="modal-save">Save item</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="../js/api.js"></script>
<script>
(function () {

  const user = Auth.requireStaff();

  let items = [];          // the stall's menu, from GET /seller/menu
  let editingSku = null;   // null = the modal adds a new item, otherwise the SKU being edited

  const itemList = document.getElementById("item-list");

  // ---------- header ----------
  function showStall(stall) {
    if (stall) document.title = `${stall.name} · Menu`;
  }
  showStall(user.stall);

  document.getElementById("sign-out").addEventListener("click", (e) => {
    e.preventDefault();
    Auth.logout();
  });

  // ---------- toast ----------
  const toast = document.getElementById("toast");
  let toastTimer = null;
  function showToast(message) {
    toast.textContent = message;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; }, 5000);
  }

  // ---------- loading ----------
  async function load() {
    try {
      const data = await Api.get("/seller/menu");
      showStall(data.stall);
      items = data.items;
      render();
    } catch (err) {
      showToast(err.message);
    }
  }

  function findItem(sku) {
    return items.find(i => i.sku === sku);
  }

  // ---------- rendering ----------
  function render() {
    itemList.innerHTML = "";

    if (items.length === 0) {
      const empty = document.createElement("p");
      empty.className = "list-footnote";
      empty.textContent = "No items yet — add your first one above.";
      itemList.appendChild(empty);
      return;
    }

    items.forEach(item => itemList.appendChild(buildRow(item)));
  }

  function buildRow(item) {
    // Add-ons don't track stock: the API sends stock = null for them.
    const outOfStock = item.track_stock && item.stock === 0;
    const isAvailable = item.available && !outOfStock;

    const row = document.createElement("div");
    row.className = "item-row" + (isAvailable ? "" : " is-unavailable");
    row.dataset.sku = item.sku;

    const thumb = item.photo_url
      ? `<img class="item-thumb" src="${escapeHtml(item.photo_url)}" alt="" loading="lazy">`
      : `<div class="item-thumb" aria-hidden="true">im</div>`;

    row.innerHTML = `
      <div class="item-identity">
        ${thumb}
        <div class="item-text">
          <span class="item-name">${escapeHtml(item.name)}</span>
          <span class="item-section">${escapeHtml(item.section || "")}</span>
        </div>
      </div>
      <span class="cell-value">${Fmt.peso(item.price)}</span>
      <span class="cell-value">${item.track_stock ? item.stock : "—"}</span>
      <label class="switch">
        <input
          type="checkbox"
          data-sku="${escapeHtml(item.sku)}"
          ${isAvailable ? "checked" : ""}
          ${outOfStock ? "disabled" : ""}
          aria-label="Available: ${escapeHtml(item.name)}"
          title="${outOfStock ? "Restock to make available" : ""}"
        >
        <span class="track" aria-hidden="true"></span>
        <span class="thumb" aria-hidden="true"></span>
      </label>
      <button type="button" class="btn-edit" data-edit="${escapeHtml(item.sku)}">Edit</button>
    `;

    return row;
  }

  // ---------- available toggle ----------
  itemList.addEventListener("change", async (e) => {
    const checkbox = e.target.closest('input[type="checkbox"][data-sku]');
    if (!checkbox) return;

    const sku = checkbox.dataset.sku;
    checkbox.disabled = true;
    try {
      await Api.patch("/seller/menu/" + encodeURIComponent(sku), { available: checkbox.checked });
    } catch (err) {
      showToast(err.message);
    }
    load();   // redraw from the server, so the switch always shows what was really saved
  });

  // ---------- add / edit modal ----------
  const backdrop = document.getElementById("modal-backdrop");
  const form = document.getElementById("add-item-form");
  const addBtn = document.getElementById("add-item-btn");
  const cancelBtn = document.getElementById("modal-cancel");
  const saveBtn = document.getElementById("modal-save");
  const modalTitle = document.getElementById("modal-title");
  const fields = {
    name: document.getElementById("field-name"),
    price: document.getElementById("field-price"),
    stock: document.getElementById("field-stock"),
    section: document.getElementById("field-section"),
    description: document.getElementById("field-description"),
    available: document.getElementById("field-available"),
  };
  const stockField = document.getElementById("stock-field");

  function openModal(item) {
    form.reset();
    editingSku = item ? item.sku : null;
    modalTitle.textContent = item ? "Edit item" : "Add item";
    saveBtn.textContent = item ? "Save changes" : "Save item";

    if (item) {
      fields.name.value = item.name;
      fields.price.value = item.price;
      fields.stock.value = item.track_stock ? item.stock : "";
      fields.section.value = item.section || "";
      fields.description.value = item.description || "";
      fields.available.checked = item.available;
    } else {
      fields.available.checked = true;
    }

    // Add-ons have no stock to edit.
    const noStock = item && !item.track_stock;
    stockField.hidden = noStock;
    fields.stock.required = !noStock;

    backdrop.hidden = false;
    fields.name.focus();
  }

  function closeModal() {
    backdrop.hidden = true;
    editingSku = null;
  }

  addBtn.addEventListener("click", () => openModal(null));
  cancelBtn.addEventListener("click", closeModal);

  itemList.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-edit]");
    if (!btn) return;
    const item = findItem(btn.dataset.edit);
    if (item) openModal(item);
  });

  backdrop.addEventListener("click", (e) => {
    if (e.target === backdrop) closeModal();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !backdrop.hidden) closeModal();
  });

  /** Read the form into the shape the API expects. */
  function formValues() {
    return {
      name: fields.name.value.trim(),
      price: Math.max(0, parseInt(fields.price.value, 10) || 0),
      stock: Math.max(0, parseInt(fields.stock.value, 10) || 0),
      section: fields.section.value.trim(),
      description: fields.description.value.trim(),
      available: fields.available.checked,
    };
  }

  /** For edits, send only what changed, so an unchanged name doesn't call the CMS. */
  function changedFields(item, values) {
    const changes = {};
    if (values.name !== item.name) changes.name = values.name;
    if (values.price !== item.price) changes.price = values.price;
    if (item.track_stock && values.stock !== item.stock) changes.stock = values.stock;
    if (values.section && values.section !== (item.section || "")) changes.section = values.section;
    if (values.description !== (item.description || "")) changes.description = values.description;
    if (values.available !== item.available) changes.available = values.available;
    return changes;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const values = formValues();
    if (values.name.length < 2) {
      showToast("Enter an item name (at least 2 characters).");
      fields.name.focus();
      return;
    }

    saveBtn.disabled = true;
    try {
      if (editingSku) {
        const item = findItem(editingSku);
        const changes = changedFields(item, values);
        if (Object.keys(changes).length) {
          await Api.patch("/seller/menu/" + encodeURIComponent(editingSku), changes);
        }
      } else {
        const body = { name: values.name, price: values.price, stock: values.stock, available: values.available };
        if (values.section) body.section = values.section;
        if (values.description) body.description = values.description;
        await Api.post("/seller/menu", body);
      }
      closeModal();
    } catch (err) {
      // 502: the ERP or CMS is down. The message says what was and wasn't saved.
      showToast(err.message);
      if (err.status === 502) closeModal();
    } finally {
      saveBtn.disabled = false;
      load();
    }
  });

  // ---------- sidebar ----------
  const navList = document.getElementById("nav-list");
  const sidebarFooter = document.querySelector(".sidebar-footer");
  const content = document.getElementById("content");
  const placeholder = document.getElementById("panel-placeholder");

  function setActivePanel(panel, label) {
    document.querySelectorAll(".nav-item[data-panel]").forEach(btn => {
      btn.classList.toggle("is-active", btn.dataset.panel === panel);
    });
    document.querySelectorAll(".nav-item[href]").forEach(link => link.classList.remove("is-active"));

    content.hidden = true;
    placeholder.hidden = false;
    placeholder.textContent = `${label} is on its way — nothing to see here yet.`;
  }

  [navList, sidebarFooter].forEach(container => {
    container.addEventListener("click", (e) => {
      const btn = e.target.closest(".nav-item[data-panel]");
      if (!btn) return;
      setActivePanel(btn.dataset.panel, btn.textContent.trim());
    });
  });

  load();

})();
</script>
</body>
</html>
