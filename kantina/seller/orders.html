<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kantina · Orders</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page-seller-app page-seller-orders">

<div class="app-shell">

  <header class="app-topbar">
    <h1 id="stall-name">Orders</h1>
    <div class="topbar-right">
      <span class="active-stat">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="7.5" cy="7.5" r="6.3" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="7.5" cy="7.5" r="2" fill="currentColor"/>
        </svg>
        <span id="active-count">– active</span>
      </span>
      <div class="user-menu" id="user-menu">
        <button class="user-menu__trigger" id="user-menu-trigger" aria-haspopup="true" aria-expanded="false">
          <span id="user-name"></span>
          <svg width="10" height="6" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="user-menu__panel" role="menu">
          <a href="login.html" role="menuitem" id="sign-out">Sign out</a>
        </div>
      </div>
    </div>
  </header>

  <div class="app-body">

    <aside class="sidebar">
      <nav>
        <ul id="nav-list">
          <li><a class="nav-item is-active" href="orders.html">Orders</a></li>
          <li><a class="nav-item" href="menu.html">Menu</a></li>
          <li><a class="nav-item" href="analytics.html">Analytics</a></li>
          <li><a class="nav-item" href="tables.html">Tables</a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <button class="nav-item" data-panel="settings">Settings</button>
      </div>
    </aside>

    <main class="board" id="board" aria-live="polite">
          </main>

    <div class="panel-placeholder" id="panel-placeholder" hidden></div>

  </div>

</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="../js/api.js"></script>
<script>
(function () {

  const user = Auth.requireStaff();
  const REFRESH_MS = 5000;

  const COLUMNS = [
    { status: "pending",    label: "Pending" },
    { status: "paid",       label: "Paid" },
    { status: "preparing",  label: "Preparing" },
    { status: "ready",      label: "Ready" },
  ];

  // Button on each card → status sent to PATCH /seller/orders/{id}/status
  const NEXT_STATUS = { accept: "paid", start: "preparing", markReady: "ready", complete: "completed" };

  let orders = [];
  let busy = false;          // an action is in flight: don't redraw over it
  let loadFailed = false;    // only toast the first failure in a row
  let refreshTimer = null;

  const board = document.getElementById("board");

  // ---------- header ----------
  function showStall(stall) {
    if (!stall) return;
    document.getElementById("stall-name").textContent = stall.name;
    document.title = `${stall.name} · Orders`;
  }
  showStall(user.stall);
  document.getElementById("user-name").textContent = user.account || user.name || "Account";
  document.getElementById("sign-out").addEventListener("click", (e) => {
    e.preventDefault();
    Auth.logout();
  });

  // ---------- toast ----------
  const toast = document.getElementById("toast");
  let toastTimer = null;
  function showToast(message) {
    toast.textContent = message;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; }, 4000);
  }

  // ---------- loading ----------
  async function load() {
    clearTimeout(refreshTimer);
    try {
      const data = await Api.get("/seller/orders");
      showStall(data.stall);
      orders = data.orders.filter(o => o.status !== "completed");
      document.getElementById("active-count").textContent = `${data.active_count} active`;
      loadFailed = false;
      if (!busy) render();
    } catch (err) {
      if (!loadFailed) showToast(err.message);
      loadFailed = true;
    } finally {
      refreshTimer = setTimeout(load, REFRESH_MS);
    }
  }

  // ---------- rendering ----------
  function metaText(order) {
    const method = order.payment_method === "gcash" ? "GCash" : "Cash";
    switch (order.status) {
      case "pending":
        return order.payment_method === "counter"
          ? `${order.items_text} · Pay at counter`
          : `${order.items_text} · Awaiting GCash payment`;
      case "paid":
        return `${method} ${Fmt.peso(order.total)}`;
      case "preparing":
        return `${order.pickup_time} · ${order.minutes_in_status} min`;
      case "ready":
        return `Waiting ${order.minutes_in_status} min`;
      default:
        return order.items_text;
    }
  }

  function render() {
    board.innerHTML = "";

    COLUMNS.forEach(col => {
      const inColumn = orders.filter(o => o.status === col.status);

      const columnEl = document.createElement("section");
      columnEl.className = "column";
      columnEl.setAttribute("aria-label", col.label);

      const header = document.createElement("h2");
      header.className = "column__header";
      header.textContent = `${col.label} \u00B7 ${inColumn.length}`;
      columnEl.appendChild(header);

      const list = document.createElement("div");
      list.className = "column__cards";

      if (inColumn.length === 0) {
        const empty = document.createElement("p");
        empty.className = "column__empty";
        empty.textContent = "Nothing here right now.";
        list.appendChild(empty);
      }

      inColumn.forEach((order, index) => {
        list.appendChild(buildCard(order, col.status, index));
      });

      columnEl.appendChild(list);
      board.appendChild(columnEl);
    });
  }

  function buildCard(order, status, indexInColumn) {
    const card = document.createElement("article");
    card.className = "card";
    card.dataset.id = order.id;

    const isQueuedPrep = status === "preparing" && indexInColumn > 0;
    if (status === "preparing" && indexInColumn === 0) card.classList.add("is-active");
    if (isQueuedPrep) card.classList.add("is-queued");

    const idEl = document.createElement("p");
    idEl.className = "card__id";
    idEl.textContent = `#${order.id}`;
    card.appendChild(idEl);

    const metaEl = document.createElement("p");
    metaEl.className = "card__meta";
    metaEl.textContent = metaText(order);
    card.appendChild(metaEl);

    const action = getAction(order, isQueuedPrep);
    if (action) {
      const btn = document.createElement("button");
      btn.className = `card__btn card__btn--${action.style}`;
      btn.textContent = action.label;
      btn.dataset.action = action.action;
      btn.dataset.id = order.id;
      card.appendChild(btn);
    }

    return card;
  }

  function getAction(order, isQueuedPrep) {
    const status = order.status;
    // Pending GCash orders are still waiting for the student to pay: the API refuses Accept.
    if (status === "pending") return order.can_accept ? { label: "Accept", action: "accept", style: "solid" } : null;
    if (status === "paid") return { label: "Start", action: "start", style: "solid" };
    if (status === "preparing" && !isQueuedPrep) return { label: "Mark ready", action: "markReady", style: "solid" };
    if (status === "ready") return { label: "Complete", action: "complete", style: "outline" };
    return null;
  }

  async function handleAction(btn) {
    const status = NEXT_STATUS[btn.dataset.action];
    if (!status || busy) return;

    busy = true;
    btn.disabled = true;
    try {
      await Api.patch(`/seller/orders/${btn.dataset.id}/status`, { status });
    } catch (err) {
      showToast(err.message);
    } finally {
      busy = false;
      load();
    }
  }

  board.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    handleAction(btn);
  });

  const navList = document.getElementById("nav-list");
  const sidebarFooter = document.querySelector(".sidebar-footer");
  const placeholder = document.getElementById("panel-placeholder");

  function setActivePanel(panel, label) {
    document.querySelectorAll(".nav-item").forEach(btn => {
      btn.classList.toggle("is-active", btn.dataset.panel === panel);
    });

    if (panel === "orders") {
      board.hidden = false;
      placeholder.hidden = true;
    } else {
      board.hidden = true;
      placeholder.hidden = false;
      placeholder.textContent = `${label} is on its way — nothing to see here yet.`;
    }
  }

  [navList, sidebarFooter].forEach(container => {
    container.addEventListener("click", (e) => {
      const btn = e.target.closest(".nav-item[data-panel]");
      if (!btn) return;
      setActivePanel(btn.dataset.panel, btn.textContent.trim());
    });
  });

  const userMenu = document.getElementById("user-menu");
  const userMenuTrigger = document.getElementById("user-menu-trigger");

  userMenuTrigger.addEventListener("click", (e) => {
    e.stopPropagation();
    const isOpen = userMenu.classList.toggle("is-open");
    userMenuTrigger.setAttribute("aria-expanded", String(isOpen));
  });

  document.addEventListener("click", () => {
    userMenu.classList.remove("is-open");
    userMenuTrigger.setAttribute("aria-expanded", "false");
  });

  render();
  load();

})();
</script>
</body>
</html>
