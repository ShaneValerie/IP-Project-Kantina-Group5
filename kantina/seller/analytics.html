<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kantina · Analytics</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page-seller-app page-seller-analytics">

<div class="app-shell">

  <header class="app-topbar">
    <h1>Analytics</h1>
    <div class="segmented" id="range-toggle">
      <button type="button" class="is-active" data-range="7">7 days</button>
      <button type="button" data-range="30">30 days</button>
    </div>
  </header>

  <div class="app-body">

    <aside class="sidebar">
      <nav>
        <ul id="nav-list">
          <li><a class="nav-item" href="orders.html">Orders</a></li>
          <li><a class="nav-item" href="menu.html">Menu</a></li>
          <li><a class="nav-item is-active" href="analytics.html">Analytics</a></li>
          <li><a class="nav-item" href="tables.html">Tables</a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <button class="nav-item" data-panel="settings">Settings</button>
        <a class="nav-item" href="login.html" id="sign-out">Sign out</a>
      </div>
    </aside>

    <main class="content" id="content">

      <div class="stat-row">
        <div class="stat-card">
          <p class="label">Revenue</p>
          <p class="value" id="stat-revenue">₱0</p>
        </div>
        <div class="stat-card">
          <p class="label">Orders</p>
          <p class="value" id="stat-orders">0</p>
        </div>
        <div class="stat-card">
          <p class="label">Avg ticket</p>
          <p class="value" id="stat-avg">₱0</p>
        </div>
      </div>

      <h2 class="section-title">Revenue by day</h2>
      <div class="chart-frame" id="chart-frame" role="img" aria-label="Revenue by day bar chart"></div>
      <p class="chart-caption" id="chart-caption">Source: Kantina ERP sales ledger</p>

      <div class="summary-row">
        <div class="summary-card">
          <h3>Top items</h3>
          <div class="summary-list" id="top-items"></div>
        </div>
        <div class="summary-card">
          <h3>Peak hours</h3>
          <div class="summary-list" id="peak-hours"></div>
        </div>
      </div>

    </main>

    <div class="panel-placeholder" id="panel-placeholder" hidden></div>

  </div>

</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="../js/api.js"></script>
<script>
(function () {

  const user = Auth.requireStaff();

  const chartFrame = document.getElementById("chart-frame");
  const chartCaption = document.getElementById("chart-caption");
  const topItemsEl = document.getElementById("top-items");
  const peakHoursEl = document.getElementById("peak-hours");

  let currentRange = "7";

  // ---------- header ----------
  if (user.stall) document.title = `${user.stall.name} · Analytics`;
  document.getElementById("sign-out").addEventListener("click", (e) => {
    e.preventDefault();
    Auth.logout();
  });

  // ---------- toast ----------
  const toast = document.getElementById("toast");
  let toastTimer = null;
  function showToast(message) {
    toast.textContent = message;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; }, 5000);
  }

  // ---------- loading ----------
  async function load(range) {
    currentRange = range;
    try {
      const data = await Api.get("/seller/analytics", { range });
      if (range !== currentRange) return;   // the other range was clicked while this one loaded
      render(data);
    } catch (err) {
      showToast(err.message);
    }
  }

  // ---------- rendering ----------
  function render(data) {
    document.getElementById("stat-revenue").textContent = Fmt.peso(data.revenue);
    document.getElementById("stat-orders").textContent = data.orders.toLocaleString();
    document.getElementById("stat-avg").textContent = Fmt.peso(data.avg_ticket);

    // Bars: the best day is 100% tall, the others are a share of it.
    const max = Math.max(0, ...data.by_day.map(d => d.revenue));
    chartFrame.innerHTML = "";
    data.by_day.forEach(day => {
      const bar = document.createElement("div");
      bar.className = "bar";
      bar.style.height = max > 0 ? `${(day.revenue / max) * 100}%` : "0%";
      bar.title = `${day.label} ${day.date}: ${Fmt.peso(day.revenue)} · ${day.orders} orders`;
      chartFrame.appendChild(bar);
    });
    chartFrame.setAttribute("aria-label",
      `Revenue by day, ${data.from} to ${data.to}. Highest day ${Fmt.peso(max)}.`);
    chartCaption.textContent = `${data.from} to ${data.to} · Source: Kantina ERP sales ledger`;

    topItemsEl.innerHTML = listRows(data.top_items, row => [row.name, `${row.qty} sold`]);
    peakHoursEl.innerHTML = listRows(data.peak_hours, row => [row.label, `${row.share}%`]);
  }

  /** Rows for the Top items / Peak hours cards. Text from the API is escaped. */
  function listRows(rows, toPair) {
    if (!rows.length) return `<div class="row"><span class="name">No sales yet</span></div>`;
    return rows.map(row => {
      const [name, value] = toPair(row);
      return `<div class="row"><span class="name">${escapeHtml(name)}</span><span class="value">${escapeHtml(value)}</span></div>`;
    }).join("");
  }

  document.getElementById("range-toggle").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-range]");
    if (!btn) return;

    document.querySelectorAll("#range-toggle button").forEach(b => b.classList.remove("is-active"));
    btn.classList.add("is-active");
    load(btn.dataset.range);
  });

  const navList = document.getElementById("nav-list");
  const sidebarFooter = document.querySelector(".sidebar-footer");
  const content = document.getElementById("content");
  const placeholder = document.getElementById("panel-placeholder");

  [navList, sidebarFooter].forEach(container => {
    container.addEventListener("click", (e) => {
      const btn = e.target.closest(".nav-item[data-panel]");
      if (!btn) return;

      content.hidden = true;
      placeholder.hidden = false;
      placeholder.textContent = `${btn.textContent.trim()} is on its way — nothing to see here yet.`;
    });
  });

  load("7");

})();
</script>
</body>
</html>
