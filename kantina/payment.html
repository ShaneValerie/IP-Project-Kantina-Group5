<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo payment — Kantina</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap">
</head>
<body class="page-payment flow-page">
<div class="app-frame" id="screen-gcash">
  <div class="topnav">
    <div class="topnav-inner">
      <a class="topnav-brand" href="home.html">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none" width="15" height="15"><path d="M6 3v8a3 3 0 0 0 3 3v7M6 3v5M9 3v5M6 8h3M17 3c-2 1.2-2 4-2 6 0 1.6.8 2.6 2 3v9" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Kantina
      </a>
      <nav class="topnav-links"></nav>
      <div class="topnav-actions">
        <a class="icon-btn" href="cart.html" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" width="17" height="17"><path d="M6 6h15l-1.5 9h-12L6 6Zm0 0L5 3H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/></svg>
        </a>
      </div>
    </div>
  </div>
  <header class="flow-head">
  <div class="flow-head-top">
    <button class="icon-btn" type="button" aria-label="Go back" onclick="goBack('checkout.html')">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="flow-head-text">
    <span class="flow-head-meta">Step 2 of 3</span>
    <h1>Pay with GCash</h1>
    <p>Demo payment — no real money is charged</p>
  </div>
  <ol class="flow-steps" aria-label="Checkout progress: step 2 of 3"><li class="done"><span>Cart</span></li><li class="done"><span>Checkout</span></li><li><span>Done</span></li></ol>
  </header>

  <div class="scroll" style="position:relative;">
    <div class="flow-body stacked-footer">

      <div class="section-block pay-amount">
        <h2 class="pay-amount-brand">GCash (demo)</h2>
        <div class="pay-amount-label">Amount due</div>
        <div class="pay-amount-value" id="gcash-amount"></div>
        <div class="pay-amount-ref" id="gcash-ref"></div>
      </div>

      <div class="divider"></div>

      <div class="security-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
        This is a simulated payment for the Kantina class project.
      </div>
    </div>

    <div class="sticky-footer footer-stack">
      <button class="btn btn-primary" type="button" id="authorize-btn" onclick="handleAuthorize()">Authorize payment</button>
      <button class="btn btn-secondary" type="button" onclick="handleCancel()">Cancel</button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
