<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap">
</head>
<body class="page-reservations flow-page">
<div class="app-frame" id="screen-reservations">
  <div class="topnav">
    <div class="topnav-inner">
      <a class="topnav-brand" href="home.html">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none" width="15" height="15"><path d="M6 3v8a3 3 0 0 0 3 3v7M6 3v5M9 3v5M6 8h3M17 3c-2 1.2-2 4-2 6 0 1.6.8 2.6 2 3v9" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Kantina
      </a>
      <nav class="topnav-links">
        <a href="home.html">Home</a>
        <a href="reservations.html" class="active">Reserve</a>
        <a href="orders.html">Orders</a>
        <a href="profile.html">Profile</a>
      </nav>
      <div class="topnav-actions">
        <a class="icon-btn" href="cart.html" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" width="17" height="17"><path d="M6 6h15l-1.5 9h-12L6 6Zm0 0L5 3H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/></svg>
        </a>
      </div>
    </div>
  </div>

  <header class="flow-head">
  <div class="flow-head-top">
    <a class="icon-btn" href="home.html" aria-label="Back to home"><svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <a class="icon-btn" href="reserve.html" aria-label="New reservation">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </a>
  </div>
  <div class="flow-head-text">
    <h1>Your reservations</h1>
    <p id="rsv-summary">Loading…</p>
  </div>
  </header>

  <div class="scroll">
    <div class="rsv-body" style="padding-bottom:30px;">
      <div class="section-label">Upcoming</div>
      <div id="upcoming-list"><p class="load-msg">Loading…</p></div>

      <div class="section-label">Past</div>
      <div id="past-list"></div>
    </div>
  </div>

  <div class="tabbar">
    <a class="tab" href="home.html">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Home</span>
    </a>
    <a class="tab active" href="reservations.html">
      <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9.5h17M8 3v3.5M16 3v3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Reserve</span>
    </a>
    <a class="tab" href="orders.html">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 3h12l1 4H5l1-4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M5 7v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V7M9 11h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Orders</span>
    </a>
    <a class="tab" href="profile.html">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.3" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Profile</span>
    </a>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script src="js/api.js"></script>
<script src="app.js"></script>
<script>
// My reservations: GET /reservations. Check in → POST /reservations/{ref}/check-in, Cancel → DELETE.
(function () {
  Auth.requireStudent();
  const upcomingEl = document.getElementById('upcoming-list');
  const pastEl = document.getElementById('past-list');

  function card(r, past) {
    const top = `
        <div class="rsv-card-top">
          <div>
            <strong>${escapeHtml(r.table)} \u00b7 ${escapeHtml(r.day_label)} ${Fmt.ampm(r.time)}</strong>
            <div class="meta">${escapeHtml(r.detail)}</div>
          </div>
          <span class="rsv-badge${past ? ' muted' : r.status === 'checked_in' || r.day_label === 'Today' ? '' : ' outline'}">${escapeHtml(r.status_label)}</span>
        </div>`;
    if (past) return `<div class="rsv-card past">${top}</div>`;
    const actions = [
      r.can_check_in ? `<button class="btn btn-primary" type="button" data-action="checkin" data-ref="${escapeHtml(r.ref)}">Check in</button>` : '',
      `<a class="btn btn-secondary" href="reservation-confirmed.html?ref=${encodeURIComponent(r.ref)}">View details</a>`,
      r.can_cancel ? `<button class="btn btn-quiet" type="button" data-action="cancel" data-ref="${escapeHtml(r.ref)}">Cancel</button>` : ''
    ].join('');
    return `<div class="rsv-card${r.day_label === 'Today' ? ' current' : ''}">${top}<div class="rsv-card-actions">${actions}</div></div>`;
  }

  function load() {
    return Api.get('/reservations')
      .then(res => {
        const n = res.upcoming.length;
        document.getElementById('rsv-summary').textContent = n ? n + ' coming up' : 'Nothing booked yet';
        upcomingEl.innerHTML = n ? res.upcoming.map(r => card(r, false)).join('')
          : '<p class="load-msg">No upcoming reservations. <a href="reserve.html">Reserve a table</a></p>';
        pastEl.innerHTML = res.past.length ? res.past.map(r => card(r, true)).join('')
          : '<p class="load-msg">No past reservations yet.</p>';
      })
      .catch(err => {
        document.getElementById('rsv-summary').textContent = '';
        upcomingEl.innerHTML = `<p class="load-msg">${escapeHtml(err.message)}</p>`;
        pastEl.innerHTML = '';
      });
  }

  upcomingEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const ref = btn.dataset.ref;
    if (btn.dataset.action === 'cancel' && !confirm('Cancel this reservation?')) return;
    btn.disabled = true;
    const call = btn.dataset.action === 'checkin'
      ? Api.post('/reservations/' + encodeURIComponent(ref) + '/check-in')
      : Api.del('/reservations/' + encodeURIComponent(ref));
    call
      .then(() => {
        if (btn.dataset.action === 'cancel' && Cart.prefs().reservation_ref === ref) Cart.setPrefs({ reservation_ref: null });
        showToast(btn.dataset.action === 'checkin' ? 'Checked in \u2014 enjoy your meal!' : 'Reservation cancelled');
        return load();
      })
      .catch(err => { showToast(err.message); btn.disabled = false; });
  });

  load();
  // check-in opens 15 minutes before the start time: refresh so the button appears by itself
  setInterval(() => { if (!document.hidden) load(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
