<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — Kantina</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page-signin">
<div class="app-frame" id="screen-signin">
  <div class="scroll">
    <div class="signin-top">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 3v8a3 3 0 0 0 3 3v7M6 3v5M9 3v5M6 8h3M17 3c-2 1.2-2 4-2 6 0 1.6.8 2.6 2 3v9" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2>Kantina</h2>
      <p>University of San Carlos, ordered ahead.</p>
    </div>

    <div class="field">
      <label for="uid">Student ID / email</label>
      <input id="uid" type="text" placeholder="e.g. 21-1234-567">
    </div>
    <div class="field">
      <label for="pwd">Password</label>
      <input id="pwd" type="password" placeholder="••••••••">
    </div>

    <div class="signin-actions">
      <a class="btn btn-primary" href="home.html">Sign in</a>
      <a class="btn btn-secondary" href="#">Create account</a>
    </div>

    <div class="signin-switch">
      Store staff? <a class="link-btn" href="#">Switch to store login</a>
    </div>
  </div>
</div>
</body>
</html>
