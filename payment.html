<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secure payment — Kantina</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page-payment">
<div class="app-frame" id="screen-gcash">
  <div class="topnav">
    <div class="topnav-inner">
      <a class="topnav-brand" href="home.html">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none" width="15" height="15"><path d="M6 3v8a3 3 0 0 0 3 3v7M6 3v5M9 3v5M6 8h3M17 3c-2 1.2-2 4-2 6 0 1.6.8 2.6 2 3v9" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Kantina
      </a>
      <nav class="topnav-links"></nav>
      <div class="topnav-actions">
        <a class="icon-btn" href="cart.html" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" width="17" height="17"><path d="M6 6h15l-1.5 9h-12L6 6Zm0 0L5 3H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/></svg>
        </a>
      </div>
    </div>
  </div>
  <div class="appbar">
    <button class="icon-btn" type="button" aria-label="Go back" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1>Secure payment</h1>
  </div>

  <div class="scroll" style="position:relative;">
    <div class="flow-body stacked-footer">

      <div class="section-block">
        <div class="pay-app-badge">
          <img src="gcash-logo.png" alt="GCash" style="width:88px;height:88px;border-radius:20px;object-fit:contain;display:block;">
        </div>
        <p class="pay-app-name">GCash</p>
        <p class="pay-app-note">Linked e-wallet checkout</p>
      </div>

      <div class="divider"></div>

      <form id="payment-form" novalidate>
        <div class="field" style="margin-top:20px;">
          <label for="mobile">Mobile number</label>
          <input type="tel" id="mobile" name="mobile" inputmode="numeric" autocomplete="tel"
                 placeholder="09XX XXX XXXX" required>
        </div>
        <div class="field">
          <label for="mpin">MPIN</label>
          <input type="password" id="mpin" name="mpin" inputmode="numeric" maxlength="6"
                 placeholder="••••••" required>
        </div>

        <div class="amount-row">
          <div>
            <div class="amount-label">Amount due</div>
            <div class="amount-ref" id="gcash-ref"></div>
          </div>
          <div class="amount-value" id="gcash-amount"></div>
        </div>
      </form>

      <div class="security-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        256-bit encrypted — secured by GCash
      </div>
    </div>

    <div class="sticky-footer footer-stack">
      <button class="btn btn-primary" type="button" id="authorize-btn" onclick="handleAuthorize()">Authorize payment</button>
      <button class="btn btn-secondary" type="button" onclick="handleCancel()">Cancel</button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
