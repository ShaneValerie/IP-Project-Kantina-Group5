<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkout — Kantina</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="page-checkout">
<div class="app-frame" id="screen-checkout">
  <div class="topnav">
    <div class="topnav-inner">
      <a class="topnav-brand" href="home.html">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none" width="15" height="15"><path d="M6 3v8a3 3 0 0 0 3 3v7M6 3v5M9 3v5M6 8h3M17 3c-2 1.2-2 4-2 6 0 1.6.8 2.6 2 3v9" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Kantina
      </a>
      <nav class="topnav-links"></nav>
      <div class="topnav-actions">
        <a class="icon-btn" href="cart.html" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" width="17" height="17"><path d="M6 6h15l-1.5 9h-12L6 6Zm0 0L5 3H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/></svg>
        </a>
      </div>
    </div>
  </div>
  <div class="appbar">
    <button class="icon-btn" type="button" aria-label="Go back" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1>Checkout</h1>
  </div>

  <div class="scroll" style="position:relative;">
    <div class="flow-body">

      <!-- Pickup time -->
      <div class="section-block">
        <h2 class="section-label">Pickup time</h2>
        <div id="pickup-slots"></div>
        <p class="slot-note">Greyed slots are at kitchen capacity</p>
      </div>

      <!-- Table -->
      <div class="section-block">
        <h2 class="section-label">Table</h2>
        <div class="info-row">
          <div class="info-main">
            <strong id="table-name"></strong>
            <span id="table-detail"></span>
          </div>
          <button class="chip" type="button" onclick="showToast('Would open Reserve a table')">Change</button>
        </div>
      </div>

      <!-- Payment -->
      <div class="section-block">
        <h2 class="section-label">Payment method</h2>
        <div class="option-list" id="payment-group" role="radiogroup" aria-label="Payment method">
          <div class="option-row" data-value="gcash" role="radio" aria-checked="true" tabindex="0">
            <span class="option-radio"></span>
            <div class="option-icon">
              <img src="gcash-logo.png" alt="GCash" style="width:30px;height:30px;border-radius:8px;object-fit:contain;display:block;">
            </div>
            <div class="option-text">
              <strong>Pay instantly via GCash</strong>
            </div>
          </div>
          <div class="option-row" data-value="counter" role="radio" aria-checked="false" tabindex="0">
            <span class="option-radio"></span>
            <div class="option-icon">
              <i class="fa-solid fa-hand-holding-dollar" style="font-size:18px;color:var(--ink-soft);"></i>
            </div>
            <div class="option-text">
              <strong>Pay at counter</strong>
              <span>Cash or scan when you pick up</span>
            </div>
          </div>
        </div>
      </div>

    </div>

    <div class="sticky-footer">
      <div class="pay-row">
        <div class="pay-total">
          <strong id="checkout-total"></strong>
          <span id="checkout-summary"></span>
        </div>
        <button class="btn btn-primary btn-compact" type="button" id="pay-btn" onclick="handlePay()"></button>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
